# == IGNORE matches expressions ==

PreferencePage_IgnoreSourceFolderFilter=&源文件夹
PreferencePage_IgnoreSourceFolderFilterToolTip=如果源文件夹匹配这些表达式，\n\
 则在检测过程中会被忽略。例如：\n\
 '*test*'、'*generated*' 或 'src\\main\\example'\n\
 否定过滤：使用 '!*test*' 仅搜索名称中包含 'test' 的源文件夹

PreferencePage_IgnorePackageFilter=&包
PreferencePage_IgnorePackageFilterToolTip=如果包匹配这些表达式，\n\
 则在检测过程中会被忽略。例如：\n\
 '*test*'（忽略名称中包含 'test' 的所有包）\n\
 否定过滤：使用 '!*internal*' 仅搜索名称中包含 'internal' 的包

PreferencePage_IgnoreClassFilter=&匹配名称
PreferencePage_IgnoreClassFilterToolTip=如果类匹配这些表达式，\n\
 则在检测过程中会被忽略。例如：\n\
 'Test*,*Test'（忽略所有以 'Test' 开头或结尾的类）\n\
 否定过滤：使用 '!*Bean' 仅搜索以 'Bean' 结尾的类

PreferencePage_IgnoreMethodFilter=&方法
PreferencePage_IgnoreMethodFilterToolTip=如果方法匹配这些表达式，\n\
 则在检测过程中会被忽略。例如：\n\
 'test*,*Test'（忽略所有以 'test' 开头或以 'Test' 结尾的方法）\n\
 否定过滤：使用 '!getInstance*' 仅搜索以 'getInstance' 开头的方法

PreferencePage_IgnoreFieldFilter=&字段
PreferencePage_IgnoreFieldFilterToolTip=如果字段匹配这些表达式，\n\
 则在检测过程中会被忽略。例如：\n\
 'test*,*Test'（忽略所有以 'test' 开头或以 'Test' 结尾的字段）\n\
 否定过滤：使用 '!*name*' 仅搜索名称中包含 'name' 的字段

