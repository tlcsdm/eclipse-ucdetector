PreferencePage_IgnoreAnnotationsFilter=带注解的代码(&A)
PreferencePage_IgnoreAnnotationsFilterToolTip=带有这些注解的代码\n\
 将在检测过程中被忽略。\n\
 建议使用完整类名，不要使用 '@'

PreferencePage_FilterClassWithMainMethod=具有 main 方法
PreferencePage_FilterClassWithMainMethodToolTip=具有 main 方法的类不会显示“未使用类”标记

PreferencePage_IgnoreImplements=&实现/继承
PreferencePage_IgnoreImplementsToolTip=忽略实现或继承\n\
 这些类/接口的类/接口（建议使用完整类名）

PreferencePage_IgnoreContainString=包含字符串
PreferencePage_IgnoreContainStringToolTip=类中如果包含这些字符串之一，将在检测过程中被忽略。\n\
 适合忽略生成的代码。\n\
 使用逗号分隔字符串列表。

PreferencePage_IgnoreBeanMethods=&Bean 方法
PreferencePage_IgnoreBeanMethodsToolTip=忽略 Java Bean 方法。例如：\n\
 \tpublic Object getX();\n\
 \tpublic void setX(Object x);\n\
 \tpublic boolean isX();

PreferencePage_IgnoreDeprecated=&已弃用代码
